seed_everything: 42

trainer:
  max_epochs: 60
  accelerator: auto
  devices: auto
  precision: 16-mixed
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/miou
        mode: max
        save_top_k: 3
        filename: "{epoch:02d}-{val_miou:.4f}"
        auto_insert_metric_name: false
    - class_path: skyscapesnet.callbacks.ScheduledClassWeightsCallback
      init_args:
        warmup_epochs: 20
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: skyscapesnet

data:
  root: data/skyscapes
  patch_size: 512
  batch_size: 1
  num_workers: 4
  train_samples_per_epoch: 1000
  sliding_stride: 256

model:
  optimizer_cfg:
    class_path: torch.optim.Adam
    init_args:
      lr: 0.0001
      weight_decay: 0.0001
  scheduler_cfg:
    class_path: torch.optim.lr_scheduler.CosineAnnealingLR
    init_args:
      T_max: 60
