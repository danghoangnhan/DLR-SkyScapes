[project]
name = "skyscapesnet-dense"
version = "0.1.0"
description = "PyTorch implementation of SkyScapesNet for fine-grained aerial semantic segmentation (ICCV 2019)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "Pillow",
    "tqdm",
    "huggingface-hub",
    "safetensors",
    "albumentations>=1.0",
    "torchmetrics>=1.3",
]

[dependency-groups]
dev = [
    "pyyaml",
    "pytest>=8",
    "pytest-cov>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyscapesnet"]
