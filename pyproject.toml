[project]
name = "skyscapesnet-dense"
version = "0.1.0"
description = "PyTorch implementation of SkyScapesNet for fine-grained aerial semantic segmentation (ICCV 2019)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "Pillow",
    "tqdm",
    "huggingface-hub",
    "safetensors",
    "torchgeo>=0.6",
    "torchmetrics>=1.3",
    "kornia>=0.7",
    "lightning>=2.2",
    "jsonargparse[signatures]>=4.27",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[project.scripts]
skyscapesnet = "skyscapesnet.cli:main"

[dependency-groups]
dev = [
    "pyyaml",
    "pytest>=8",
    "pytest-cov>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyscapesnet"]
